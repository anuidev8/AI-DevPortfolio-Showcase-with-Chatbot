[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-after-hours-guide"
version = "1.0.0"
description = "AI After Hours voice guide — LiveKit + ElevenLabs TTS"
requires-python = ">=3.12, <3.15"

dependencies = [
    "livekit-agents[images]>=1.7.0",
    "livekit-plugins-elevenlabs>=1.7.0",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.uv]
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
